# ==========================================
# TRIGGERS
# ==========================================
trigger:
  branches:
    include:
      - master
      - develop

pool:
  vmImage: 'ubuntu-24.04'

stages:

# ==========================================
# STAGE 1: INTEGRACIÓN CONTINUA (CI)
# ==========================================
- stage: CI
  displayName: 'CI'

  jobs:

    - job: prevalidation
      displayName: 'Prevalidar'
      steps:
        - script: |
            echo "Simulación de verificación de la estructura del repositorio realizada correctamente."
          displayName: 'Validación inicial'

    - job: build
      displayName: 'Compilar'
      dependsOn: prevalidation

      steps:

        - script: |
            echo "Descargando JDK 25..."
            curl -L -o $(Agent.TempDirectory)/jdk25.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
          displayName: 'Descargar JDK 25'

        - task: JavaToolInstaller@0
          displayName: 'Instalar Java 25'
          inputs:
            versionSpec: '25'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'LocalDirectory'
            jdkFile: '$(Agent.TempDirectory)/jdk25.tar.gz'
            jdkDestinationDirectory: '$(Agent.ToolsDirectory)/jdk'
            cleanDestinationDirectory: true

        - script: |
            chmod +x gradlew
            ./gradlew compileJava -x test
          displayName: 'Compilar con Gradle'

    - job: test
      displayName: 'Pruebas y Cobertura'
      dependsOn: build

      steps:

        - script: |
            echo "Descargando JDK 25..."
            curl -L -o $(Agent.TempDirectory)/jdk25.tar.gz \
            "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse"
          displayName: 'Descargar JDK 25'

        - task: JavaToolInstaller@0
          displayName: 'Instalar Java 25'
          inputs:
            versionSpec: '25'
            jdkArchitectureOption: 'x64'
            jdkSourceOption: 'LocalDirectory'
            jdkFile: '$(Agent.TempDirectory)/jdk25.tar.gz'
            jdkDestinationDirectory: '$(Agent.ToolsDirectory)/jdk'
            cleanDestinationDirectory: true

        - script: |
            chmod +x gradlew
            ./gradlew check
          displayName: 'Ejecutar Pruebas y Cobertura'

        - task: PublishCodeCoverageResults@2
          displayName: 'Publicar Cobertura'
          inputs:
            summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/build/reports/jacoco/test/jacocoTestReport.xml'
            pathToSources: '$(System.DefaultWorkingDirectory)/src/main/java'

# ==========================================
# STAGE 2: SECURITY
# ==========================================
- stage: Security
  displayName: 'Security'

  dependsOn: CI
  condition: succeeded()

  jobs:

    - job: trivy_scan
      displayName: 'Escaneo con Trivy'

      steps:

        - script: |
            echo "Instalando Trivy..."

            sudo apt-get update

            wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.67.2_Linux-64bit.deb

            sudo dpkg -i trivy_0.67.2_Linux-64bit.deb

            trivy --version
          displayName: 'Instalar Trivy'

        - script: |
            echo "Iniciando escaneo..."

            trivy fs . \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --format table
          displayName: 'Analizar vulnerabilidades'

# ==========================================
# STAGE 3: APROBACIÓN MANUAL
# ==========================================
- stage: Approval
  displayName: 'Aprobar'

  dependsOn: Security
  condition: succeeded()

  jobs:

    - job: manual_gate
      displayName: 'Esperando aprobación'
      pool: server

      steps:

        - task: ManualValidation@0
          inputs:
            notifyUsers: 'jefersonvillacis@hotmail.com'
            instructions: 'Aprobación requerida para ejecutar la fase de despliegue continuo en OpenShift Sandbox.'
            onTimeout: 'reject'

# ==========================================
# STAGE 4: DESPLIEGUE CONTINUO (CD)
# ==========================================
- stage: CD
  displayName: 'CD'

  dependsOn: Approval
  condition: succeeded()

  jobs:

    - job: deploy_openshift
      displayName: 'Desplegar en OpenShift'

      steps:

        - script: |

            echo "=== 1. Descargando OpenShift CLI ==="

            curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz

            tar -xzf openshift-client-linux.tar.gz

            sudo mv oc /usr/local/bin/

            echo "=== 2. Login ==="

            oc login \
              --token=$(OPENSHIFT_TOKEN) \
              --server=$(OPENSHIFT_SERVER) \
              --insecure-skip-tls-verify=true

            echo "=== 3. Proyecto ==="

            oc project testing-account-dev

            echo "=== 4. Aplicando recursos ==="

            oc apply -f helm/build-config.yaml
            oc apply -f helm/dev.yml
            oc apply -f helm/service.yaml
            oc apply -f helm/route.yaml

            echo "=== 5. Build ==="

            oc start-build jee-msa-web-demo-pipeline --follow

            echo "=== 6. Restart ==="

            oc rollout restart deployment/jee-msa-web-demo-pipeline

            echo "=== 7. Esperando rollout ==="

            oc rollout status deployment/jee-msa-web-demo-pipeline

            echo "=== 8. URL ==="

            oc get route jee-msa-web-demo-pipeline -o jsonpath='{.spec.host}'
          displayName: 'Desplegar aplicación'

# ==========================================
# STAGE 5: NOTIFICACIONES
# ==========================================
- stage: Notifications
  displayName: 'Notificar'

  dependsOn:
    - CI
    - Security
    - Approval
    - CD

  condition: always()

  jobs:

    - job: send_status_email
      displayName: 'Enviar Reporte'

      steps:

        - script: |
            echo "Estado final del pipeline: $(Agent.JobStatus)"
          displayName: 'Simulación de correo'
